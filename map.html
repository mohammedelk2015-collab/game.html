<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenStreetMap</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101b35;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

h1 {
    color: white;
    font-size: 55px;
    margin-bottom: 30px;
}

button {
    background: #168cff;
    color: white;
    border: none;
    padding: 20px 75px;
    font-size: 30px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 0 #0755a8;
    transition: 0.2s;
}

button:hover {
    background: #40a5ff;
    transform: translateY(-3px);
}

button:active {
    transform: translateY(4px);
    box-shadow: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>🗺️ OPENSTREETMAP</h1>
    <button onclick="openMap()">START</button>
</div>

<script>
function openMap() {
    window.location.href =
    "https://www.openstreetmap.org/export/embed.html?bbox=-7.65%2C33.52%2C-7.55%2C33.62&layer=mapnik";
}
</script>

</body>
</html>
